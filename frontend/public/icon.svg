<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Aura Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Surface Gradient -->
    <linearGradient id="planetGrad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Planet Specular Highlight -->
    <radialGradient id="planetHighlight" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0"/>
    </radialGradient>

    <!-- Atmospheric Rings Gradient -->
    <linearGradient id="ringGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="65%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Outer Glow Ring Gradient -->
    <linearGradient id="ringGradOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shadow Cast by Planet on the Rings -->
    <radialGradient id="ringShadow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#020617" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for Planet Surface to add cloud/band textures -->
    <clipPath id="planetClip">
      <circle cx="256" cy="256" r="110"/>
    </clipPath>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="256" cy="256" r="230" fill="url(#spaceGlow)"/>

  <!-- Stars / Accents -->
  <g fill="#A5B4FC" opacity="0.6">
    <circle cx="90" cy="140" r="2"/>
    <circle cx="130" cy="95" r="3"/>
    <circle cx="410" cy="110" r="2.5"/>
    <circle cx="430" cy="370" r="2"/>
    <circle cx="100" cy="390" r="2.5"/>
    <!-- Little 4-point sparkle star -->
    <path d="M 390 160 Q 390 170 380 170 Q 390 170 390 180 Q 390 170 400 170 Q 390 170 390 160 Z" fill="#E0E7FF" opacity="0.8"/>
    <path d="M 120 320 Q 120 327 113 327 Q 120 327 120 334 Q 120 327 127 327 Q 120 327 120 320 Z" fill="#E0E7FF" opacity="0.7"/>
  </g>

  <!-- BACK PORTION OF RINGS (tilted ~-26 degrees) -->
  <g transform="rotate(-26 256 256)">
    <!-- Outer faint track -->
    <ellipse cx="256" cy="256" rx="236" ry="58" fill="none" stroke="url(#ringGradOuter)" stroke-width="2.5" opacity="0.4"/>

    <!-- Main Outer Ring (Back half) -->
    <path d="M 24 256 A 232 54 0 0 1 488 256" fill="none" stroke="url(#ringGradMain)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Cassini Division Gap -->
    <!-- Inner Main Ring (Back half) -->
    <path d="M 52 256 A 204 46 0 0 1 460 256" fill="none" stroke="url(#ringGradOuter)" stroke-width="18" stroke-linecap="round" opacity="0.95"/>

    <!-- Innermost Whispering Ring (Back half) -->
    <path d="M 88 256 A 168 36 0 0 1 424 256" fill="none" stroke="#E0E7FF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- PLANET BODY -->
  <circle cx="256" cy="256" r="110" fill="url(#planetGrad)"/>

  <!-- Planet Atmospheric Bands / Textures (Clipped to sphere) -->
  <g clip-path="url(#planetClip)" opacity="0.35">
    <ellipse cx="256" cy="220" rx="140" ry="24" fill="#312E81"/>
    <ellipse cx="256" cy="245" rx="140" ry="18" fill="#C7D2FE" opacity="0.3"/>
    <ellipse cx="256" cy="280" rx="140" ry="26" fill="#1E1B4B" opacity="0.6"/>
    <ellipse cx="256" cy="315" rx="140" ry="20" fill="#4338CA"/>
    <ellipse cx="256" cy="180" rx="140" ry="22" fill="#818CF8" opacity="0.4"/>
  </g>

  <!-- Planet 3D Lighting & Shading Overlay -->
  <circle cx="256" cy="256" r="110" fill="url(#planetHighlight)"/>

  <!-- Shadow cast by planet onto the ring's near edge right side -->
  <g clip-path="url(#planetClip)">
    <path d="M 170 300 C 230 330 310 310 366 256 C 366 320 310 366 256 366 C 200 366 160 330 170 300 Z" fill="#090A1A" opacity="0.45"/>
  </g>

  <!-- FRONT PORTION OF RINGS (tilted ~-26 degrees, passing over the planet) -->
  <g transform="rotate(-26 256 256)">
    <!-- Outer Faint Track (Front half) -->
    <ellipse cx="256" cy="256" rx="236" ry="58" fill="none" stroke="url(#ringGradOuter)" stroke-width="2.5" opacity="0.4"/>

    <!-- Main Outer Ring (Front half) -->
    <path d="M 488 256 A 232 54 0 0 1 24 256" fill="none" stroke="url(#ringGradMain)" stroke-width="14" stroke-linecap="round"/>

    <!-- Inner Main Ring (Front half) -->
    <path d="M 460 256 A 204 46 0 0 1 52 256" fill="none" stroke="url(#ringGradOuter)" stroke-width="18" stroke-linecap="round"/>

    <!-- Innermost Whispering Ring (Front half) -->
    <path d="M 424 256 A 168 36 0 0 1 88 256" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Delicate Orbit Accent Dot / Moonlet -->
    <circle cx="455" cy="275" r="4" fill="#F472B6" filter="drop-shadow(0 0 4px #F472B6)"/>
  </g>
</svg>
