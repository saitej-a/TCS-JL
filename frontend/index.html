<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- §10.1's theme colors (v2 sky-700 per 05 §4.1.1 as amended in 9.5): the
         manifest carries the light value (the format has one theme_color), and
         the dark scheme is expressed here. -->
    <meta name="theme-color" content="#0369A1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />
    <meta
      name="description"
      content="TCS Joining Tracker — an independent community platform for candidates tracking their TCS joining journey. Not affiliated with TCS."
    />
    <title>TCSJL</title>
    <!-- Pre-paint theme resolution. Dark is the app default (see
         `src/theme/theme.ts`), and applying it only from React's effect would
         flash the light markup first. This mirrors `readStoredMode` exactly:
         a valid stored mode wins, `system` follows the OS, and anything else —
         including storage being unavailable — resolves to dark. -->
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("theme");
        } catch (error) {
          // Storage disabled: fall through to the default.
        }
        if (mode !== "light" && mode !== "dark" && mode !== "system") {
          mode = "dark";
        }
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
