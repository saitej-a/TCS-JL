<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- §10.1's theme colors (Forest Emerald & Warm Stone): the
         manifest carries the light value, and the dark scheme is expressed here. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0A09" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="TCS Joining Tracker — an independent community platform for candidates tracking their TCS joining journey. Not affiliated with TCS."
    />
    <title>TCSJL</title>
    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7583223729268159" crossorigin="anonymous"></script>
    <!-- The project mark: the SVG for browsers that take it, the PWA raster as
         the fallback and as the iOS home-screen icon. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <!-- Pre-paint theme resolution. Dark is the app default (see
         `src/theme/theme.ts`), and applying it only from React's effect would
         flash the light markup first. This mirrors `readStoredMode` exactly:
         a valid stored mode wins, `system` follows the OS, and anything else —
         including storage being unavailable — resolves to dark. -->
    <script>
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("theme");
        } catch (error) {
          // Storage disabled: fall through to the default.
        }
        if (mode !== "light" && mode !== "dark" && mode !== "system") {
          mode = "dark";
        }
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
