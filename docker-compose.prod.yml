# Production topology — TCS Joining Tracker (Phase 1.2)
# Host-level Nginx handles TLS 1.3 reverse proxy & SSL certificates.
# Ports: 127.0.0.1:8000 for WSGI (web) and 127.0.0.1:8001 for ASGI (websockets).
# NO host ports on db/redis (threat T-1.1-03), no source bind mounts.

name: tcsjl-prod

services:
  db:
    image: postgres:16.15-alpine
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -w -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  web:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2", "--timeout", "60", "--access-logfile", "-"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      RUN_DB_MIGRATIONS: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      PUSH_BACKEND: firebase
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account
    env_file:
      - .env.prod
    secrets:
      - firebase_service_account
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      # X-Forwarded-Proto mirrors what nginx sends; without it SECURE_SSL_REDIRECT
      # answers the plain-HTTP probe with a 301 instead of a status.
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/health/ready/', headers={'X-Forwarded-Proto': 'https'}); r = c.getresponse(); r.read(); assert r.status == 200, r.status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  asgi:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      PUSH_BACKEND: firebase
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account
    env_file:
      - .env.prod
    secrets:
      - firebase_service_account
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/health/ready/', headers={'X-Forwarded-Proto': 'https'}); r = c.getresponse(); r.read(); assert r.status == 200, r.status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  celery_worker:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "default,notifications,maintenance"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      PUSH_BACKEND: firebase
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account
    env_file:
      - .env.prod
    secrets:
      - firebase_service_account
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "celery", "-A", "config", "beat", "--loglevel=INFO"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: {}
  redis_data: {}

secrets:
  firebase_service_account:
    file: ./secrets/firebase-service-account.json
