# T1.8 — CI pipeline (decisions locked 2026-09-21: Ruff-only linting, pytest in 1.2).
# Lint → Format → Test, with PostgreSQL 16 + Redis 7 service containers mirroring
# the compose topology. Main-branch pushes also deploy after lint and test pass.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Run tests independently so a lint failure does not prevent test results.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcs_tracker
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: tcs_joining_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcs_tracker -d tcs_joining_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: tcs_tracker
      POSTGRES_PASSWORD: ci-not-a-secret
      POSTGRES_DB: tcs_joining_tracker
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    name: Deploy to VM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-vm-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Transfer application files
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${VM_HOST:?Set the VM_HOST Actions variable}"
          : "${VM_USER:?Set the VM_USER Actions variable}"
          : "${VM_DEPLOY_PATH:?Set the VM_DEPLOY_PATH Actions variable}"
          : "${VM_SSH_PRIVATE_KEY:?Set the VM_SSH_PRIVATE_KEY Actions secret}"
          [[ "$VM_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "VM_DEPLOY_PATH must be an absolute path containing only letters, digits, '.', '_', '/', or '-'."
            exit 1
          }
          [[ "$VM_SSH_PORT" =~ ^[0-9]+$ ]] || {
            echo "VM_SSH_PORT must be a numeric TCP port."
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          # Secrets pasted from JSON or escaped strings often contain literal "\n"
          # or CRLF endings; OpenSSH rejects those with "error in libcrypto".
          case "$VM_SSH_PRIVATE_KEY" in
            *'\n'*) echo "Note: VM_SSH_PRIVATE_KEY contains literal '\n' sequences; converting them to newlines." ;;
          esac
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" \
            | sed -e 's/\\n/\n/g' -e 's/\r$//' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Fail here with a diagnosis instead of a cryptic ssh/rsync error. Only a
          # classification is printed; the key material itself is never echoed.
          if ! key_err=$(ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" 2>&1 >/dev/null); then
            key_bytes=$(wc -c < "$HOME/.ssh/deploy_key")
            key_lines=$(wc -l < "$HOME/.ssh/deploy_key")
            echo "::error::VM_SSH_PRIVATE_KEY did not load as an unencrypted private key ($key_bytes bytes, $key_lines lines)."
            case "$key_err" in
              *passphrase*)
                echo "::error::The key is passphrase-protected, which GitHub Actions cannot unlock. Re-save it without a passphrase: ssh-keygen -p -f <keyfile> -N ''"
                ;;
            esac
            case "$(head -c 200 "$HOME/.ssh/deploy_key" | tr -d '\r\n')" in
              *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*|*"BEGIN DSA PRIVATE KEY"*|*"BEGIN PRIVATE KEY"*)
                if [[ $key_lines -le 1 ]]; then
                  echo "::error::The whole key sits on one line, so its newlines were stripped when the secret was saved. Re-save the raw file."
                else
                  echo "::error::The header is a valid private-key header, so the body was truncated or altered in transit. Store the complete file."
                fi
                ;;
              *"PUBLIC KEY"*|ssh-*|ecdsa-*)
                echo "::error::The secret holds a PUBLIC key. Store the matching private key file (no .pub extension) instead."
                ;;
              *"PuTTY-User-Key-File"*)
                echo "::error::The secret is a PuTTY .ppk file. Convert it first: puttygen key.ppk -O private-openssh -o key"
                ;;
              *)
                echo "::error::No private-key header was found. Store the private key file itself, not its path or a copied-from-terminal rendering of it."
                ;;
            esac
            echo "::error::Set it with: gh secret set VM_SSH_PRIVATE_KEY --repo <owner>/<repo> < <private-key-file>"
            exit 1
          fi

          rsync -az \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='secrets/' \
            --exclude='nginx/certs/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $VM_SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            ./ "$VM_USER@$VM_HOST:$VM_DEPLOY_PATH/"

      - name: Build and restart production services
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$VM_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd '$VM_DEPLOY_PATH' && docker compose -f docker-compose.prod.yml up -d --build"
