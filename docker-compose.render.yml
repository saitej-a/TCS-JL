# Render-oriented app containers for local validation and Docker-based hosts.
# Render does not deploy Compose files directly; deploy each service separately
# there, using this file as the source for the image and process commands.
# PostgreSQL is external and configured through DATABASE_URL. Redis runs as a
# Compose service; no database volume from docker-compose.prod.yml is reused.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.onrender.com}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PORT: ${PORT:-10000}

services:
  web:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:10000
      - --workers
      - "4"
      - --threads
      - "2"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    env_file:
      - .env.render
    environment:
      <<: *app-env
      RUN_DB_MIGRATIONS: "1"
    ports:
      - "${HOST_PORT:-10000}:${PORT:-10000}"
    expose:
      - "${PORT:-10000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,os; c=http.client.HTTPConnection('127.0.0.1',int(os.environ.get('PORT','10000')),timeout=5); c.request('GET','/health/ready/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); r=c.getresponse(); r.read(); assert r.status==200,r.status"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  asgi:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8001"
      - config.asgi:application
    env_file:
      - .env.render
    environment:
      <<: *app-env
      PORT: "8001"
    ports:
      - "${ASGI_HOST_PORT:-8001}:8001"
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1',8001,timeout=5); c.request('GET','/health/ready/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); r=c.getresponse(); r.read(); assert r.status==200,r.status"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  celery_worker:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - -Q
      - default,notifications,maintenance
    env_file:
      - .env.render
    environment:
      <<: *app-env
      PUSH_BACKEND: firebase
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - firebase_service_account
    restart: unless-stopped

  celery_beat:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
    env_file:
      - .env.render
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: {}

secrets:
  firebase_service_account:
    file: ./secrets/firebase-service-account.json
