# Local production-mode preview. PostgreSQL and Redis run in Compose alongside
# the app processes and the TLS/WebSocket reverse proxy.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
  DATABASE_URL: ""
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  POSTGRES_DB: ${POSTGRES_DB:-tcs_joining_tracker}
  POSTGRES_USER: ${POSTGRES_USER:-tcs_tracker}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.render}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PUSH_BACKEND: firebase
  FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcs_joining_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tcs_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.render}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "4"
      - --threads
      - "2"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    env_file:
      - .env.render
    environment:
      <<: *app-env
      RUN_DB_MIGRATIONS: "1"
    secrets:
      - firebase_service_account
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health/ready/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); r=c.getresponse(); r.read(); assert r.status==200,r.status"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  asgi:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - config.asgi:application
    env_file:
      - .env.render
    environment:
      <<: *app-env
    secrets:
      - firebase_service_account
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health/ready/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); r=c.getresponse(); r.read(); assert r.status==200,r.status"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  celery_worker:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - -Q
      - default,notifications,maintenance
    env_file:
      - .env.render
    environment:
      <<: *app-env
    secrets:
      - firebase_service_account
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build:
      context: .
    command:
      - /app/docker/entrypoint.sh
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
    env_file:
      - .env.render
    environment:
      <<: *app-env
    secrets:
      - firebase_service_account
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
      asgi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: {}
  redis_data: {}
  static_data: {}

secrets:
  firebase_service_account:
    file: ./secrets/firebase-service-account.json
